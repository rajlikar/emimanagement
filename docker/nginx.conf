# nginx vhost for Cloud Run.
#
# The literal 8080 below is rewritten by docker/entrypoint.sh to whatever Cloud
# Run puts in $PORT. Keeping a real number here (rather than a placeholder) means
# the file is still valid if you run the image locally without an entrypoint.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Cloud Run's front end already terminates TLS and enforces a request size
    # limit, but nginx has its own 1m default which would reject document uploads
    # before PHP ever sees them. Keep this >= upload_max_filesize in php.ini.
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Access logs off: Cloud Run already records every request in Cloud Logging
    # with status, latency and trace ID. Duplicating that doubles log volume and
    # counts against the free logging allowance. Errors still go to stderr.
    access_log off;
    error_log /dev/stderr warn;

    location = /favicon.ico { log_not_found off; }
    location = /robots.txt  { log_not_found off; }

    # Vite writes content-hashed filenames into public/build, so those files are
    # immutable — a change produces a new name. Cache them hard; this is the
    # single biggest win for repeat visits and costs nothing.
    # `expires` is deliberately NOT used alongside add_header here: it emits its
    # own Cache-Control, and the response would carry two conflicting ones.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Uploaded loan documents (public/storage -> storage/app/public, which is the
    # GCS bucket mount in production). No `expires` here: unlike build assets
    # these filenames are stable and their contents can be replaced.
    location /storage/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Daily EMI reminder trigger, called by Cloud Scheduler. Routed to its own
    # php-fpm pool (port 9001, see php-fpm.conf) because the command sleeps 10s
    # between emails and outlasts the normal 75s/90s request limits. Exact-match
    # (=) so it wins over the regex locations below and no other URL can reach
    # the long-timeout pool. The route itself is protected by REMINDER_TOKEN.
    location = /internal/send-emi-reminders {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 860s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Inertia responses embed the full serialised page props as JSON, which
        # comfortably exceeds nginx's default 4k/8k FastCGI buffers. Too small a
        # buffer forces nginx to spool the response to a temp file on every
        # request — slow, and noisy in the error log.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;

        # Must exceed php.ini max_execution_time so PHP times out first and
        # returns a real error page instead of nginx's opaque 504.
        fastcgi_read_timeout 90s;
    }

    # Block dotfiles (.env, .git, ...) while still allowing ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
