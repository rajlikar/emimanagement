; supervisord runs the processes this image needs — nginx, php-fpm and (when the
; database is SQLite) Litestream — because a container has exactly one PID 1 and
; none of them can supervise the others.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:litestream]
; Continuous SQLite -> GCS replication. Enabled by docker/entrypoint.sh through
; LITESTREAM_ENABLED (it is exported in every branch, so this expansion always
; resolves). When false the program simply never starts.
;
; priority=5 is the LOWEST number here, so it starts first and — because
; supervisord shuts programs down in the reverse order — stops LAST. That is the
; point: nginx and php-fpm stop accepting writes first, then Litestream gets
; stopwaitsecs to push the final WAL frames to GCS. Cloud Run allows only ~10s
; between SIGTERM and SIGKILL for the whole container, so keep this under that.
;
; Runs as www-data like php-fpm, so the -wal/-shm files SQLite creates are
; usable by both. If it ever exits for good the die-on-child-exit listener below
; takes the container down: serving writes that are no longer being replicated is
; worse than restarting.
command=litestream replicate -config /etc/litestream.yml
user=www-data
autostart=%(ENV_LITESTREAM_ENABLED)s
autorestart=true
startsecs=2
stopwaitsecs=8
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
; -F keeps php-fpm in the foreground so supervisord can track it.
command=php-fpm -F
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; php-fpm is listed first and given a lower priority number so it is accepting
; connections on :9000 before nginx starts proxying to it.
; start-nginx waits for php-fpm on :9000 before binding the public port, so the
; first request after a cold start cannot reach a php-fpm that is not up yet.
command=/usr/local/bin/start-nginx
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Without this listener, a permanently dead nginx leaves php-fpm running and
; supervisord alive — so the container's PID 1 is healthy, Cloud Run's health
; check on the TCP port fails but the instance is never *replaced* cleanly, and
; you get an instance that accepts nothing and reports nothing.
;
; Killing supervisord when either child gives up makes the container exit, which
; Cloud Run understands: it discards the instance and starts a fresh one.
[eventlistener:die-on-child-exit]
command=sh -c "printf 'READY\n'; while read -r _line; do echo '[supervisord] a managed process exited; shutting down container' >&2; kill -SIGQUIT $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED,PROCESS_STATE_STOPPED
autostart=true
autorestart=unexpected
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
