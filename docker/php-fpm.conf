; php-fpm pool overrides, loaded after the image's own www.conf / docker.conf
; because of the zz- filename prefix.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; CRITICAL for Cloud Run.
;
; php-fpm's default is clear_env = On, which wipes the parent process environment
; from every worker. Cloud Run delivers *all* configuration — APP_KEY, DB_*,
; secrets mounted from Secret Manager — as process environment variables, so with
; clear_env on, Laravel's env() returns null for every one of them and the app
; boots with no database credentials and no encryption key.
;
; The official php:*-fpm images already set this in docker.conf; it is repeated
; here so the requirement is explicit and survives a base-image change.
clear_env = no

; Worker sizing for a 1 vCPU / 512Mi Cloud Run instance.
;
; `static` rather than `dynamic`: instances are short-lived and traffic arrives in
; bursts right after a cold start, which is exactly when `dynamic` would be busy
; forking children instead of serving. A fixed pool has predictable memory too,
; which matters when the container is OOM-killed rather than swapped.
;
; 4 workers x 128M memory_limit = 512M worst case, but PHP requests rarely
; approach their limit; real usage is ~40-60M each. Keep Cloud Run --concurrency
; near this number: requests beyond it queue in nginx rather than failing, but a
; deep queue just turns into latency.
;
; If you raise memory to 1Gi, 8 workers / --concurrency=16 is the next step up.
pm = static
pm.max_children = 4
pm.max_requests = 500

; Surface worker stdout/stderr as container logs rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Log any request slower than this with a PHP stack trace showing where it was
; stuck. Invaluable for diagnosing a request that trips the Cloud Run timeout.
slowlog = /dev/stderr
request_slowlog_timeout = 15s

; Backstop above php.ini max_execution_time (60s): max_execution_time does not
; count time spent blocked in a system call, such as a hung database connection.
; This one does, and kills the worker.
request_terminate_timeout = 75s


; -----------------------------------------------------------------------------
; Second pool: long-running internal jobs (the daily EMI reminder)
; -----------------------------------------------------------------------------
; Cloud Run has no scheduler, so Cloud Scheduler calls
; POST /internal/send-emi-reminders, which runs `send:emi-reminder` inside the
; request. That command sleeps 10s between emails, so a run with a few reminders
; outlasts the 75s request_terminate_timeout of the web pool above.
;
; Raising that limit for the web pool would remove the hung-request backstop from
; every user-facing route. A separate pool, reachable only through the one nginx
; location that names it, keeps the backstop where it matters.
;
; One worker: it can run only one reminder sweep at a time, so a Scheduler retry
; or a double-click cannot send duplicate emails in parallel (the second call
; waits in the FastCGI queue instead). Costs ~50M, within the 512Mi budget.
[reminders]
user = www-data
group = www-data
listen = 127.0.0.1:9001
clear_env = no
pm = static
pm.max_children = 1
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
; Must stay below the Cloud Run request timeout (set to 900s at deploy).
request_terminate_timeout = 840s
