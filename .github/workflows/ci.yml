name: EmiManagement

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Laravel 12 requires PHP ^8.2 (composer.json); 8.0 made `composer install` fail
    # because composer.lock resolves to packages that need >= 8.2.
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_sqlite, sqlite3
        coverage: none

    # Pages render through @vite(), which throws "Vite manifest not found" when
    # public/build is missing. public/build is gitignored, so CI must build it.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install PHP dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install JS dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Generate key
      run: php artisan key:generate

    - name: Directory permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run tests (PHPUnit)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
